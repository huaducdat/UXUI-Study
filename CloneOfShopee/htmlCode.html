<!DOCTYPE html>
<html lang="en" class="resetTransform">

<head>
    <meta charset="UTF-8">
    <title>DHMall</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="name" content="DH-eMall">
    <meta name="keywords" content="eMall, shopping, buying, selling, shope">
    <meta name="description" content="buy-and-sell-everything">
    <meta name="author" content="Duc-Dat-Hua">
    <link rel="stylesheet" href="../CloneOfShopee/htmlCode.html">
    <link rel="stylesheet" href="../CloneOfShopee/asset/headerStyle.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }
    </style>
</head>

<body class="resetTransform">
    <header id="page_header">
        <div class="header-top">
            <div class="header-top-left">
                <div class="qr-wrapper">
                    <p class="highlightTxt">Go to shopping App</p>
                    <div class="qr-popup"><img
                            src="https://i.pinimg.com/736x/25/68/c3/2568c33d9a67a96f84ea334b94ba4c5b.jpg" alt="QRcode">
                        <p style="margin-top: 5px;">QR Code</p>
                    </div>
                </div>
                <a href="#" class="highlightTxt">Connect</a>
                <div class="header-top-left-icon-box">
                    <a href="#"><img class="addBorderHighLight"
                            src="../CloneOfShopee/asset/Resource/iconSGV/facebook.svg" alt="icon"></a>
                    <a href="#"><img class="addBorderHighLight"
                            src="../CloneOfShopee/asset/Resource/iconSGV/instagram.svg" alt="icon"></a>
                </div>
            </div>
            <div class="header-top-right">
                <div class="header-topRight_elementBox">
                    <img src="../CloneOfShopee/asset/Resource/iconSGV/bell.svg" alt="icon">
                    <a href="#">Notice</a>
                </div>
                <div class="header-topRight_elementBox">
                    <img src="../CloneOfShopee/asset/Resource/iconSGV/question-circle.svg" alt="icon">
                    <a href="#">Help</a>
                </div>
                <div class="header-topRight_elementBox">
                    <div class="userAvatarWrapper">
                        <img class="userAvatar"
                            src="https://i.pinimg.com/736x/ab/5d/b0/ab5db062543c3dce6eda7e8249744311.jpg" alt="Avatar">
                    </div>
                    <a href="#">User Name</a>
                </div>
            </div>
        </div>
        <div class="header-bott">
            <div class="header-bott-left">
                
                <h1>DHMALL</h1>
            </div>
            <div class="header-bott-center">
                <input type="text" placeholder="Input to Search">
                <div class="buttSearchBox">
                    <div class="searchOption">In Shop</div>
                    <button class="searchButt"><img src="../CloneOfShopee/asset/Resource/iconSGV/search.svg"
                            alt=""></button>
                </div>
            </div>
            <div class="header-bott-right">
                <img class="Basket" src="" alt=""></img>
            </div>
        </div>
    </header>
    <main class="resetTransform"></main>
    <footer class="resetTransform"></footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Job-12</title>
    <style>
        body {
            display: flex;
            justify-content: start;
            align-items: center;
            flex-direction: column;
            gap: 30px;
        }

        #user-form {
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
            gap: 15px;
        }

        #my-table {
            /* border: inset 2px solid grey; */
            border-collapse: collapse;
            width: 300px;
            border-radius: 6px;
            overflow: hidden;
        }

        th {
            background: grey;
        }

        th,
        td {
            /* border: 1px solid grey; */
            text-align: center;
        }

        td {
            background-color: rgb(226, 226, 226);
        }

        tr {
            border-bottom: 1px solid gray;
        }

        tr:hover {
            background: green;
        }

        td:hover {
            background-color: rgb(83, 216, 21);
        }

        #edit-board {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            border: 3px solid grey;
            padding: 15px 18px;
            border-radius: 6px;
            position: fixed;
            z-index: 9;
            background: white;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        #edit-board-overlay {
            position: fixed;
            content: "";
            background-color: rgb(0, 0, 0, .6);
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            /* z-index: -1; */
            backdrop-filter: blur(3px);
            box-shadow: inset 0 0 60px black;
        }

        #edit-gender-box {
            border: 2px solid gray;
            padding: 12px;
            border-radius: 3px;

        }

        #edit-gender-box p {
            margin: 0;
            font-weight: bold;
            margin-bottom: 9px;
        }

        #cancel-btn,
        #ok-butt {
            padding: 3px 9px;
            width: 5em;
            height: 2em;
            font-weight: bold;
            border-radius: 3px;
        }

        input {
            border-radius: 3px;
        }

        .info-edit-box {
            display: flex;
            justify-content: space-between;
            gap: 3px;
            font-weight: bold;
            width: 220px;
        }
    </style>
</head>

<body>
    <form id="user-form">
        <label for="user-name">Name:<input type="text" id="user-name"></label>
        <label for="user-age">Age:<input type="number" id="user-age"></label>
        <div id="gender-box">
            <label for="tog1">Male:<input type="radio" id="tog1" value="male" checked name="genderTog"></label>
            <label for="tog2">Female:<input type="radio" id="tog2" value="female" name="genderTog"></label>
        </div>
        <button type="submit">Add</button>
    </form>
    <table id="my-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Function</th>
            </tr>
        </thead>
        <tbody id="my-tbody">

        </tbody>
    </table>
    <div id="edit-box" style="display: none">
        <div id="edit-board-overlay"></div>
        <form id="edit-board">
            <strong>Edit Board</strong>
            <div class="info-edit-box"> <label for="name-input">Name</label>
                <input type="text" id="name-input">
            </div>
            <div class="info-edit-box">
                <label for="age-input">Age</label>
                <input type="number" id="age-input">
            </div>
            <div id="edit-gender-box">
                <p>Gender</p>
                <div>
                    <label for="male-input"><input type="radio" id="male-input" name="edit-gender-tog" value="male"
                            checked>Male</label>
                    <label for="female-input"><input type="radio" id="female-input" name="edit-gender-tog"
                            value="female">Female</label>
                </div>
            </div>
            <button type="button" id="cancel-btn">Cancel</button>
            <button type="submit" id="ok-butt">OK</button>
        </form>
    </div>

    <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../job12/js/index1.js"></script>

</body>

</html>

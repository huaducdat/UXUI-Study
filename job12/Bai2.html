<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bai tap 2</title>
    <style>
        html {
            font-size: 15px;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #add-work-box {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #work-table {
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 2px solid rgb(0, 0, 0);
            text-align: left;
        }

        thead {
            background-color: rgb(124, 124, 124);
        }

        tbody {
            background-color: rgb(212, 212, 212);
        }

        input {
            padding: 9px;
            border-radius: 6px;
            border: none;
            outline: none;
            background-color: rgb(228, 228, 228);
        }

        label {
            font-size: 1.2rem;
            font-weight: bold;
        }

        #add-work-box div {
            display: flex;
            gap: 15px;
            align-items: start;
        }

        #description-input {
            border-radius: 6px;
            outline: none;
            border: none;
            background-color: rgb(228, 228, 228);
            padding: 9px;

        }

        #edit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            background-color: rgba(128, 128, 128, 0.3);
            backdrop-filter: blur(3px);
        }

        #edit-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 60px;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #edit-form textarea {
            background-color: rgb(228, 228, 228);
            border: none;
            outline: none;
            border-radius: 6px;
        }
        #edit-box{
            display: none;
        }
    </style>
</head>

<body>
    <div id="add-work-box">
        <div>
            <label for="work-name-input">Work's name:</label>
            <input type="text" id="work-name-input" placeholder="input name of work...">
            <label for="description-input">Description:</label>
            <textarea name="description-txt-input" id="description-input"
                placeholder="input description of work..."></textarea>
        </div>
        <button id="add-butt">Add</button>
    </div>
    <table id="work-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="table-body">

        </tbody>
        <button id="save-data-btn">Save Data</button>
    </table>
    <div id="edit-box">
        <div id="edit-overlay"></div>
        <form id="edit-form">
            <label for="edit-name-input">Name:</label>
            <input type="text" id="edit-name-input">
            <label for="edit-des-input">Description:</label>
            <textarea name="edit-des-input" id="edit-des-input"></textarea>
            <button id="cancel-btn" type="reset">Cancel</button>
            <button id="accept-btn" type="submit">Accept</button>
        </form>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/bai2.js"></script>
</body>

</html>
